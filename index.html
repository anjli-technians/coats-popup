<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Pause Side Drawer</title>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           VIDEO SECTION
        ========================================= */

        .video-section {
            position: relative;
            overflow: hidden;
        }


        /* =========================================
           VIDEO WRAPPER
        ========================================= */

        .video-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #000; 
        }


        .video-wrapper video {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =========================================
           PLAY / PAUSE BUTTON
        ========================================= */

        .video-play-pause {
            position: absolute;

            top: 20px;
            right: 20px;

            width: 48px;
            height: 48px;

            z-index: 20;

            border: 0;
            border-radius: 50%;

            background: rgba(0, 42, 84, 0.9);

            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 16px;

            transition: all 0.3s ease;
        }


        .video-play-pause:hover {
            background: #1698b7;
        }


        /* Play/Pause icons */

        .video-play-pause .pause-icon {
            display: none;
        }


        .video-wrapper.is-playing
        .video-play-pause .play-icon {
            display: none;
        }


        .video-wrapper.is-playing
        .video-play-pause .pause-icon {
            display: inline-block;
        }


        /* =========================================
           LEFT SIDE DRAWER
        ========================================= */

        .video-drawer {
            position: absolute;

            top: 0;
            left: 0;

            width: 360px;
            height: 100%;

            z-index: 15;

            background: #fff;

            transform: translateX(-100%);

            transition:
                transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);

            box-shadow:
                8px 0 30px rgba(0, 0, 0, 0.18);

            display: flex;
            align-items: center;
        }


        /* Drawer open */

        .video-section.drawer-open
        .video-drawer {

            transform: translateX(0);

        }


        /* =========================================
           DRAWER CONTENT
        ========================================= */

        .video-drawer-content {
            width: 100%;
            padding: 40px 30px;
        }


        .video-drawer-label {
            display: inline-block;

            margin-bottom: 15px;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #1698b7;
        }


        .video-drawer h3 {
            margin: 0 0 15px;

            font-size: 30px;
            line-height: 1.2;

            color: #002a54;
        }


        .video-drawer p {
            margin: 0 0 25px;

            font-size: 16px;
            line-height: 1.6;

            color: #555;
        }


        /* =========================================
           REFERENCE LINK
        ========================================= */

        .reference-link {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 12px 22px;

            background: #002a54;

            color: #fff;

            text-decoration: none;

            border-radius: 5px;

            font-size: 15px;
            font-weight: 600;

            transition: all 0.3s ease;
        }


        .reference-link:hover {
            background: #1698b7;
            color: #fff;
        }


        /* =========================================
           CLOSE BUTTON
        ========================================= */

        .drawer-close {
            position: absolute;

            top: 15px;
            right: 15px;

            width: 34px;
            height: 34px;

            border: 0;

            border-radius: 50%;

            background: #f1f1f1;

            color: #002a54;

            font-size: 22px;

            cursor: pointer;

            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.3s ease;
        }


        .drawer-close:hover {
            background: #002a54;
            color: #fff;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 767.98px) {

            .video-drawer {
                width: 85%;
            }


            .video-drawer-content {
                padding: 30px 22px;
            }


            .video-drawer h3 {
                font-size: 24px;
            }


            .video-drawer p {
                font-size: 14px;
            }


            .video-play-pause {
                top: 12px;
                right: 12px;

                width: 42px;
                height: 42px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     VIDEO SECTION
===================================================== -->

<section class="video-section">


    <div class="container-fluid">


        <div class="row justify-content-center">


            <div class="col-lg-12 p-0">


                <!-- =====================================
                     VIDEO WRAPPER
                ====================================== -->

                <div class="video-wrapper">


                    <!-- =================================
                         REAL VIDEO
                    ================================== -->

                    <video
                        class="pause-drawer-video"
                        preload="metadata"
                        playsinline
                    >

                        <!-- REAL PUBLIC VIDEO -->

                        <source
                            src="https://dev.coatsdigital.com/wp-content/uploads/2026/09/homepage-video-1.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support HTML5 video.

                    </video>


                    <!-- =================================
                         PLAY / PAUSE BUTTON
                    ================================== -->

                    <button
                        type="button"
                        class="video-play-pause"
                        aria-label="Play video"
                    >

                        <span class="play-icon">
                            ▶
                        </span>

                        <span class="pause-icon">
                            ❚❚
                        </span>

                    </button>


                    <!-- =================================
                         LEFT DRAWER
                    ================================== -->

                    <div class="video-drawer">


                        <!-- CLOSE BUTTON -->

                        <button
                            type="button"
                            class="drawer-close"
                            aria-label="Close drawer"
                        >

                            &times;

                        </button>


                        <!-- DRAWER CONTENT -->

                        <div class="video-drawer-content">


                            <span class="video-drawer-label">
                                Reference
                            </span>


                            <h3>
                                Explore More
                            </h3>


                            <p>
                                Want to know more about this
                                video? Check the reference
                                link below.
                            </p>


                            <a
                                href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="reference-link"
                            >

                                View Reference

                                <span>
                                    →
                                </span>

                            </a>


                        </div>


                    </div>


                </div>


            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /*
    |--------------------------------------------------------------------------
    | GET ALL VIDEO SECTIONS
    |--------------------------------------------------------------------------
    */

    const videoSections =
        document.querySelectorAll(".video-section");


    videoSections.forEach(function (section) {


        /*
        |--------------------------------------------------------------------------
        | ELEMENTS
        |--------------------------------------------------------------------------
        */

        const wrapper =
            section.querySelector(".video-wrapper");

        const video =
            section.querySelector(".pause-drawer-video");

        const playPauseButton =
            section.querySelector(".video-play-pause");

        const drawerClose =
            section.querySelector(".drawer-close");


        /*
        |--------------------------------------------------------------------------
        | SAFETY CHECK
        |--------------------------------------------------------------------------
        */

        if (
            !wrapper ||
            !video ||
            !playPauseButton ||
            !drawerClose
        ) {
            return;
        }


        /*
        |--------------------------------------------------------------------------
        | VIDEO PLAY
        |--------------------------------------------------------------------------
        */

        video.addEventListener("play", function () {


            /*
            * Show pause icon
            */

            wrapper.classList.add("is-playing");


            /*
            * Close drawer
            */

            section.classList.remove("drawer-open");


            /*
            * Accessibility
            */

            playPauseButton.setAttribute(
                "aria-label",
                "Pause video"
            );

        });


        /*
        |--------------------------------------------------------------------------
        | VIDEO PAUSE
        |--------------------------------------------------------------------------
        */

        video.addEventListener("pause", function () {


            /*
            * Don't open drawer when video has ended
            */

            if (video.ended) {

                section.classList.remove(
                    "drawer-open"
                );

                wrapper.classList.remove(
                    "is-playing"
                );

                return;
            }


            /*
            * Change icon
            */

            wrapper.classList.remove(
                "is-playing"
            );


            /*
            * OPEN LEFT DRAWER
            */

            section.classList.add(
                "drawer-open"
            );


            /*
            * Accessibility
            */

            playPauseButton.setAttribute(
                "aria-label",
                "Play video"
            );

        });


        /*
        |--------------------------------------------------------------------------
        | PLAY / PAUSE BUTTON
        |--------------------------------------------------------------------------
        */

        playPauseButton.addEventListener(
            "click",
            function (e) {

                e.preventDefault();

                e.stopPropagation();


                /*
                * If paused → PLAY
                */

                if (video.paused) {

                    video.play().catch(
                        function (error) {

                            console.log(
                                "Video play error:",
                                error
                            );

                        }
                    );

                }


                /*
                * If playing → PAUSE
                */

                else {

                    video.pause();

                }

            }
        );


        /*
        |--------------------------------------------------------------------------
        | DRAWER CLOSE
        |
        | Close drawer + automatically play video
        |--------------------------------------------------------------------------
        */

        drawerClose.addEventListener(
            "click",
            function (e) {

                e.preventDefault();

                e.stopPropagation();


                /*
                * Close drawer
                */

                section.classList.remove(
                    "drawer-open"
                );


                /*
                * Automatically play video
                */

                video.play().catch(
                    function (error) {

                        console.log(
                            "Video play error:",
                            error
                        );

                    }
                );

            }
        );


        /*
        |--------------------------------------------------------------------------
        | VIDEO ENDED
        |--------------------------------------------------------------------------
        */

        video.addEventListener(
            "ended",
            function () {

                section.classList.remove(
                    "drawer-open"
                );

                wrapper.classList.remove(
                    "is-playing"
                );

                playPauseButton.setAttribute(
                    "aria-label",
                    "Play video"
                );

            }
        );


    });

});

</script>


</body>

</html>
